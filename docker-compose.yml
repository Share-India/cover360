services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file next to this compose file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # SMS OTP for sign-up (MSG91)
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      # Defaults to SQLite stored in the volume below; set a MySQL URL here to use MySQL instead
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cover360.db}
    volumes:
      - cover360-data:/data
    ports:
      # Bound to localhost only (nginx is the public entry point). Change BACKEND_PORT if 5000 is taken.
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bound to localhost only. Change FRONTEND_PORT if 3000 is taken by another app.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  cover360-data:
